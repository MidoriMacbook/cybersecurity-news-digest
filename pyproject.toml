[project]
name = "cybersecurity-news-digest"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "sqlalchemy>=2.0,<3", "httpx>=0.28,<1", "feedparser>=6,<7", "beautifulsoup4>=4.12,<5", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.13,<3", "types-beautifulsoup4"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
mypy_path = "apps/api"
check_untyped_defs = true
ignore_missing_imports = true
exclude = [".venv", "apps/web"]
